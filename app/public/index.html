<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f5f4;
      color: #1c1917;
      display: flex;
      justify-content: center;
      padding: 48px 20px;
    }
    main { width: 100%; max-width: 560px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    .intro { color: #57534e; margin: 0 0 28px; line-height: 1.5; }
    form {
      background: white;
      border: 1px solid #e7e5e4;
      border-radius: 12px;
      padding: 24px;
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .hint { color: #78716c; font-weight: 400; font-size: 13px; }
    textarea, input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d6d3d1;
      border-radius: 8px;
      font: inherit;
      font-size: 15px;
    }
    textarea { min-height: 140px; resize: vertical; }
    .counter { text-align: right; color: #78716c; font-size: 12px; margin: 4px 0 18px; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1c1917;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
    .status.success { display: block; background: #dcfce7; color: #166534; }
    .status.error { display: block; background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <main>
    <h1>Share your feedback</h1>
    <p class="intro">Found a bug, missing a feature, or just love something? Tell us in a few words.</p>

    <form id="feedback-form">
      <label for="message">Your feedback</label>
      <textarea id="message" maxlength="2000" required placeholder="What's on your mind?"></textarea>
      <div class="counter" id="counter">0 / 2000</div>

      <label for="email">Email <span class="hint">(optional, only if you'd like a reply)</span></label>
      <input id="email" type="email" placeholder="you@example.com">

      <button id="submit-button" type="submit">Send feedback</button>
      <div class="status" id="status-box" role="status"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById("feedback-form");
    const messageInput = document.getElementById("message");
    const emailInput = document.getElementById("email");
    const counter = document.getElementById("counter");
    const submitButton = document.getElementById("submit-button");
    const statusBox = document.getElementById("status-box");

    function showStatus(text, type) {
      statusBox.textContent = text;
      statusBox.className = "status " + type;
    }

    messageInput.addEventListener("input", () => {
      counter.textContent = messageInput.value.length + " / 2000";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault(); // stay on the page instead of reloading it
      showStatus("", "");
      submitButton.disabled = true;
      submitButton.textContent = "Sending...";

      try {
        const response = await fetch("/api/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: messageInput.value, email: emailInput.value }),
        });
        const data = await response.json();

        if (response.ok) {
          form.reset();
          counter.textContent = "0 / 2000";
          showStatus("Thanks! Your feedback has been received.", "success");
        } else {
          showStatus(data.error || "Something went wrong. Please try again.", "error");
        }
      } catch {
        showStatus("Could not reach the server. Please check your connection and try again.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Send feedback";
      }
    });
  </script>
</body>
</html>
