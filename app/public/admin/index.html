<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Feedback Hub Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f5f4;
      color: #1c1917;
      padding: 40px 20px;
    }
    main { max-width: 860px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 26px; }
    .meta { color: #78716c; font-size: 13px; margin: 0; }
    .state { color: #78716c; }

    .item {
      background: white;
      border: 1px solid #e7e5e4;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .item:hover { border-color: #a8a29e; }
    .item summary { list-style: none; cursor: pointer; padding: 16px 18px; }
    .item summary::-webkit-details-marker { display: none; }
    .item[open] summary { border-bottom: 1px solid #f5f5f4; }
    .summary-text { font-weight: 600; margin: 8px 0 4px; }
    .body { padding: 14px 18px 18px; }
    .message { white-space: pre-wrap; line-height: 1.5; margin: 0 0 12px; }

    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 12px;
      padding: 2px 9px;
      border-radius: 999px;
      background: #f5f5f4;
      border: 1px solid #e7e5e4;
      color: #44403c;
    }
    .badge.bug { background: #fee2e2; border-color: #fecaca; color: #991b1b; }
    .badge.feature_request { background: #dbeafe; border-color: #bfdbfe; color: #1e40af; }
    .badge.ux_issue { background: #fef3c7; border-color: #fde68a; color: #92400e; }
    .badge.praise { background: #dcfce7; border-color: #bbf7d0; color: #166534; }
    .badge.urgency-high { border-color: #dc2626; color: #dc2626; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Feedback</h1>
      <p class="meta" id="count"></p>
    </header>
    <p class="state" id="state">Loading...</p>
    <div id="list"></div>
  </main>

  <script>
    const TYPE_LABELS = {
      bug: "Bug",
      feature_request: "Feature request",
      ux_issue: "UX issue",
      praise: "Praise",
      other: "Other",
    };

    // Creates an element. User data always goes through textContent,
    // so it is displayed as text and can never run as code (XSS protection)
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    // The database stores UTC time; show it in the viewer's own time zone
    function formatDate(value) {
      return new Date(value.replace(" ", "T") + "Z").toLocaleString();
    }

    function renderItem(item) {
      const details = el("details", "item");
      const summary = el("summary");

      const badges = el("div", "badges");
      if (item.status === "classified") {
        badges.append(el("span", "badge " + item.type, TYPE_LABELS[item.type] || item.type));
        badges.append(el("span", "badge", item.sentiment));
        badges.append(el("span", "badge urgency-" + item.urgency, item.urgency + " urgency"));
      } else {
        badges.append(el("span", "badge", "Unclassified"));
      }
      summary.append(badges);
      summary.append(el("p", "summary-text", item.summary || item.message.slice(0, 120)));
      summary.append(el("p", "meta", formatDate(item.created_at)));
      details.append(summary);

      const body = el("div", "body");
      body.append(el("p", "message", item.message));
      if (item.email) {
        const reply = el("p", "meta", "Reply to: ");
        const link = el("a", null, item.email);
        link.href = "mailto:" + item.email;
        reply.append(link);
        body.append(reply);
      }
      details.append(body);

      return details;
    }

    async function load() {
      const state = document.getElementById("state");
      try {
        const response = await fetch("/api/admin/feedback");
        if (response.status === 401) {
          state.textContent = "Your session has expired. Reload the page to sign in again.";
          return;
        }
        if (!response.ok) {
          throw new Error("Status " + response.status);
        }

        const { items } = await response.json();
        document.getElementById("count").textContent =
          items.length === 1 ? "1 item" : items.length + " items";

        if (items.length === 0) {
          state.textContent = "No feedback yet.";
          return;
        }

        state.remove();
        const list = document.getElementById("list");
        for (const item of items) {
          list.append(renderItem(item));
        }
      } catch {
        state.textContent = "Could not load feedback. Please try again.";
      }
    }

    load();
  </script>
</body>
</html>
